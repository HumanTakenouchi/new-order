<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新契約書作成依頼 管理ダッシュボード</title>
<script src="https://unpkg.com/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif; background: #F1F5FB; padding: 1rem; }
.wrap { max-width: 980px; margin: 0 auto; }
.header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 8px; }
.header-title { font-size: 16px; font-weight: 600; color: #1E2761; }
.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.login-btn { font-size: 12px; padding: 5px 14px; border-radius: 6px; border: none; background: #2563EB; color: white; cursor: pointer; font-weight: 500; }
.login-btn:hover { background: #1D4ED8; }
.logout-btn { font-size: 12px; padding: 5px 14px; border-radius: 6px; border: 0.5px solid #CBD5E1; background: white; color: #64748B; cursor: pointer; }
.user-name { font-size: 12px; color: #64748B; }
.sync-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; padding: 8px 12px; background: white; border-radius: 8px; border: 0.5px solid #E2E8F0; }
.sync-status { font-size: 12px; color: #64748B; flex: 1; }
.sync-btn { font-size: 12px; padding: 4px 12px; border-radius: 6px; border: 0.5px solid #CBD5E1; background: white; color: #1E293B; cursor: pointer; }
.sync-btn:hover { background: #F1F5FB; }
.sync-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.auth-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; padding: 8px 12px; background: #F1F5FB; border-radius: 8px; flex-wrap: wrap; }
.auth-bar label { font-size: 12px; color: #64748B; }
.auth-bar input[type=password] { font-size: 13px; padding: 4px 8px; border-radius: 6px; border: 0.5px solid #CBD5E1; background: white; color: #1E293B; width: 110px; height: 28px; }
.auth-bar button { font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 0.5px solid #CBD5E1; background: white; color: #1E293B; cursor: pointer; height: 28px; }
.mode-badge { font-size: 11px; padding: 2px 10px; border-radius: 100px; font-weight: 500; }
.mode-edit { background: #DCFCE7; color: #15803D; }
.mode-view { background: #F1F5F9; color: #64748B; border: 0.5px solid #E2E8F0; }
.auth-err { font-size: 12px; color: #DC2626; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
.metric { background: white; border-radius: 8px; padding: 10px 12px; border: 0.5px solid #E2E8F0; }
.metric-label { font-size: 12px; color: #64748B; margin-bottom: 4px; }
.metric-val { font-size: 22px; font-weight: 500; color: #1E293B; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1rem; padding: 8px 12px; background: white; border-radius: 8px; border: 0.5px solid #E2E8F0; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #64748B; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.filter-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 1rem; }
.filter-row input, .filter-row select { font-size: 13px; padding: 6px 10px; border-radius: 6px; border: 0.5px solid #CBD5E1; background: white; color: #1E293B; height: 32px; width: 100%; }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { background: white; border: 0.5px solid #E2E8F0; border-radius: 10px; padding: 12px 14px; transition: border-color 0.15s; }
.card:hover { border-color: #CBD5E1; }
.card.deadline-urgent { border-left: 3px solid #E24B4A; }
.card.deadline-soon3  { border-left: 3px solid #EA580C; }
.card.deadline-soon7  { border-left: 3px solid #EAB308; }
.card-header { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.card-no { font-size: 11px; color: #94A3B8; min-width: 24px; padding-top: 2px; }
.card-main { flex: 1; min-width: 0; }
.card-company { font-size: 14px; font-weight: 500; color: #1E2761; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-staff { font-size: 13px; color: #64748B; margin-top: 2px; }
.card-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 100px; font-weight: 500; white-space: nowrap; }
.badge-branch  { background: #F1F5F9; color: #64748B; border: 0.5px solid #E2E8F0; }
.badge-new     { background: #DBEAFE; color: #1D4ED8; }
.badge-replace { background: #FFEDD5; color: #9A3412; }
.badge-done    { background: #DCFCE7; color: #15803D; }
.badge-check   { background: #FFEDD5; color: #9A3412; }
.badge-action  { background: #FFEDD5; color: #9A3412; }
.badge-cancel  { background: #FEE2E2; color: #991B1B; }
.badge-pending { background: #F1F5F9; color: #64748B; border: 0.5px solid #E2E8F0; }
.card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 90px; }
.dl-none   { font-size: 12px; color: #94A3B8; }

.dl-urgent { font-size: 12px; font-weight: 500; color: #991B1B; background: #FEE2E2; border-radius: 6px; padding: 2px 7px; }
.dl-soon3  { font-size: 12px; font-weight: 500; color: #9A3412; background: #FFEDD5; border-radius: 6px; padding: 2px 7px; }
.dl-soon7  { font-size: 12px; font-weight: 500; color: #854D0E; background: #FEF08A; border-radius: 6px; padding: 2px 7px; }
.dl-normal { font-size: 12px; color: #64748B; }
.dl-label  { font-size: 10px; color: #94A3B8; text-align: right; }
.card-detail { display: none; margin-top: 12px; border-top: 0.5px solid #E2E8F0; padding-top: 12px; }
.card-detail.open { display: block; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; margin-bottom: 12px; }
.info-row { font-size: 12px; }
.info-label { color: #64748B; margin-bottom: 2px; }
.info-val { color: #1E293B; }
.edit-section { border-top: 0.5px solid #E2E8F0; padding-top: 12px; }
.section-title { font-size: 11px; font-weight: 500; color: #64748B; margin-bottom: 10px; letter-spacing: 0.04em; text-transform: uppercase; }
.edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.edit-group { display: flex; flex-direction: column; gap: 4px; }
.edit-group.full { grid-column: 1 / -1; }
.edit-label { font-size: 11px; color: #64748B; }
.edit-group select, .edit-group textarea { font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 0.5px solid #CBD5E1; background: white; color: #1E293B; width: 100%; }
.edit-group select:disabled, .edit-group textarea:disabled { opacity: 0.5; cursor: not-allowed; background: #F1F5F9; }
.edit-group textarea { resize: vertical; min-height: 56px; font-family: inherit; }
.send-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.send-group { display: flex; flex-direction: column; gap: 6px; }
.send-label { font-size: 11px; font-weight: 500; color: #64748B; }
.send-sub { font-size: 11px; color: #94A3B8; }
.send-fields { display: flex; flex-direction: column; gap: 6px; }
.send-fields select, .send-fields input { font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 0.5px solid #CBD5E1; background: white; color: #1E293B; width: 100%; }
.send-fields select:disabled, .send-fields input:disabled { opacity: 0.5; cursor: not-allowed; background: #F1F5F9; }
.save-btn { margin-top: 12px; padding: 7px 16px; border-radius: 6px; border: 0.5px solid #CBD5E1; background: white; color: #1E293B; font-size: 13px; cursor: pointer; }
.save-btn:hover { background: #F1F5FB; }
.save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.saved-msg { font-size: 12px; color: #15803D; margin-left: 10px; display: none; }
.empty { text-align: center; padding: 2rem; color: #94A3B8; font-size: 14px; }
.date-tab-wrap { background: white; border: 0.5px solid #CBD5E1; border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; gap: 6px; }
.date-tabs { display: flex; gap: 4px; }
.date-tab { font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 0.5px solid #CBD5E1; background: white; color: #64748B; cursor: pointer; }
.date-tab.active { background: #2563EB; color: white; border-color: #2563EB; }
.date-input-row { display: flex; align-items: center; gap: 6px; }
.date-input-row label { font-size: 11px; color: #64748B; white-space: nowrap; }
.date-input-row input[type=date] { font-size: 12px; border: 0.5px solid #CBD5E1; border-radius: 4px; color: #1E293B; height: 26px; padding: 0 6px; background: white; }
.date-clear { font-size: 11px; color: #94A3B8; border: none; background: none; cursor: pointer; padding: 0; }
.loading { text-align: center; padding: 2rem; color: #64748B; font-size: 14px; }
.error-msg { padding: 12px 16px; background: #FEE2E2; border-radius: 8px; color: #991B1B; font-size: 13px; margin-bottom: 1rem; border-left: 3px solid #DC2626; }
</style>
</head>
<body>
<div class="wrap">

<div class="header-bar">
  <div class="header-title">更新契約書作成依頼 管理ダッシュボード</div>
  <div class="header-right">
    <span class="user-name" id="user-name"></span>
    <button class="login-btn" id="login-btn" onclick="signIn()" disabled style="opacity:0.5;cursor:not-allowed">読み込み中…</button>
    <button class="logout-btn" id="logout-btn" style="display:none" onclick="signOut()">ログアウト</button>

</div>

<div id="error-area"></div>

<div class="sync-bar">
  <span class="sync-status" id="sync-status">ログインしてデータを読み込んでください</span>
  <button class="sync-btn" id="sync-btn" onclick="loadData()" disabled>🔄 更新</button>

<div class="auth-bar">

    <label>編集パスワード</label>

  </div>
  <div id="logout-edit-form" style="display:none">
    <button onclick="doLogout()">閲覧モードに戻る</button>

</div>

<div class="metrics" id="metrics"></div>

<div class="legend">
  <span class="legend-item"><span class="legend-dot" style="background:#E24B4A"></span><span style="color:#991B1B;font-weight:500">開始まで3日以内・超過</span></span>
  <span class="legend-item"><span class="legend-dot" style="background:#EA580C"></span><span style="color:#9A3412;font-weight:500">開始まで7日以内</span></span>
  <span class="legend-item"><span class="legend-dot" style="background:#EAB308"></span><span style="color:#854D0E;font-weight:500">開始まで14日以内</span></span>

<div class="filter-row">
  <input type="text" id="search" placeholder="企業・スタッフ名検索">
  <div style="display:flex;align-items:center;gap:4px;background:white;border:0.5px solid #CBD5E1;border-radius:6px;padding:0 10px;height:32px">
    <label style="font-size:11px;color:#64748B;white-space:nowrap">開始日</label>
    <input type="date" id="filterDateFrom" style="font-size:12px;border:none;background:transparent;color:#1E293B;height:28px;outline:none;">
    <button onclick="document.getElementById('filterDateFrom').value='';renderAll();" style="font-size:11px;color:#94A3B8;border:none;background:none;cursor:pointer;padding:0">✕</button>

    <label style="font-size:11px;color:#64748B;white-space:nowrap">終了日</label>
    <input type="date" id="filterDateTo" style="font-size:12px;border:none;background:transparent;color:#1E293B;height:28px;outline:none;">
    <button onclick="document.getElementById('filterDateTo').value='';renderAll();" style="font-size:11px;color:#94A3B8;border:none;background:none;cursor:pointer;padding:0">✕</button>
  </div>
  <select id="filterBranch"><option value="">すべての支店</option></select>
  <select id="filterTanto"><option value="">すべての担当者</option></select>
  <select id="filterKind">
    <option value="">すべての作成種別</option>
    <option value="更新契約">更新契約</option>

  </select>
  <select id="filterStatus">
    <option value="">すべてのステータス</option>
    <option>依頼受付</option>

    <option>支店対応依頼中</option>

  </select>
  <select id="filterDeadline">
    <option value="">すべての開始日</option>
    <option value="urgent">開始まで3日以内・超過</option>

    <option value="soon7">開始まで14日以内</option>

  <select id="sortOrder">
    <option value="new" selected>回答が新しい順</option>
    <option value="old">回答が古い順</option>

<div class="cards" id="cards">
  <div class="loading">Microsoftアカウントでログインしてデータを読み込んでください</div>

<script>
// ═══════════════════════════════════════
//  設定（変更が必要な場合はここだけ編集）
// ═══════════════════════════════════════
const CONFIG = {
  clientId:  'f7fbcd5a-fbb3-4ca6-8e78-c4f7df82bb4c',
  tenantId:  '12196b8c-4c46-441c-8edc-12fd2c69d733',
  siteHost:  'humans.sharepoint.com',
  sitePath:  '/sites/msteams_d48605',
  filePath:  '/アプリ/Microsoft Forms/【テスト】竹之内 更新依頼/data_renewal.txt',
};

const PW       = '85200';
const MAKERS   = ['（未設定）','中野','中村','田村'];
const SENDERS  = ['（未設定）','竹之内','井上','清瀧'];
const STATUSES = ['依頼受付','支店チェック待ち','支店対応依頼中','作成完了','依頼キャンセル'];

let isEdit       = false;
let msalInstance = null;
let accessToken  = null;
let state        = [];
const today = new Date(); today.setHours(0,0,0,0);

// ═══════════════════════════════════════
//  Microsoft認証（MSAL）
// ═══════════════════════════════════════
async function initMsal() {
  msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId:    CONFIG.clientId,
      authority:   `https://login.microsoftonline.com/${CONFIG.tenantId}`,
      redirectUri: window.location.href.split('?')[0],
    },
    cache: { cacheLocation: 'sessionStorage' }
  });
  await msalInstance.initialize();
  const resp = await msalInstance.handleRedirectPromise();
  if (resp) { onSignedIn(resp); return; }
  const accounts = msalInstance.getAllAccounts();
  if (accounts.length > 0) {
    try {
      const silent = await msalInstance.acquireTokenSilent({
        scopes: ['Files.ReadWrite','Sites.ReadWrite.All'],
        account: accounts[0]
      });
      onSignedIn(silent);
    } catch(e) {
      // サイレント失敗時はリダイレクトで再認証
      try {
        await msalInstance.acquireTokenRedirect({
          scopes: ['Files.ReadWrite','Sites.ReadWrite.All'],
          account: accounts[0]
        });
      } catch(e2) { /* ログインボタン表示のまま */ }
    }
  }
}

async function signIn() {
  try {
    await msalInstance.loginRedirect({
      scopes: ['Files.ReadWrite','Sites.ReadWrite.All']
    });
  } catch(e) { showError('ログインに失敗しました: ' + e.message); }
}

function signOut() {
  msalInstance.logoutRedirect();
  accessToken = null;
  document.getElementById('login-btn').style.display  = '';
  document.getElementById('logout-btn').style.display = 'none';
  document.getElementById('user-name').textContent    = '';
  document.getElementById('sync-btn').disabled        = true;
  document.getElementById('sync-status').textContent  = 'ログインしてデータを読み込んでください';
  state = [];
  document.getElementById('cards').innerHTML = '<div class="loading">Microsoftアカウントでログインしてデータを読み込んでください</div>';
  renderMetrics([]);
}

function onSignedIn(resp) {
  accessToken = resp.accessToken;
  const name  = resp.account?.name || resp.account?.username || '';
  document.getElementById('user-name').textContent    = name;
  document.getElementById('login-btn').style.display  = 'none';
  document.getElementById('logout-btn').style.display = '';
  document.getElementById('sync-btn').disabled        = false;
  loadData();
}

// ═══════════════════════════════════════
//  Graph API（SharePoint読み書き）
// ═══════════════════════════════════════
function graphUrl() {
  // /drives/{driveId}/root:/{path}:/content 形式ではなく
  // sites/{host}:{path}/drive/items/root:/{filePath}:/content 形式を使う
  const filePath = CONFIG.filePath.startsWith('/') ? CONFIG.filePath.slice(1) : CONFIG.filePath;
  const encodedPath = filePath.split('/').map(s => encodeURIComponent(s)).join('/');
  return `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteHost}:${CONFIG.sitePath}:/drive/root:/${encodedPath}:/content`;
}

async function getSiteId() {
  const res = await fetch(
    `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteHost}:${CONFIG.sitePath}`,
    { headers: { Authorization: `Bearer ${accessToken}` } }
  );
  const data = await res.json();
  return data.id;
}

async function loadData() {
  document.getElementById('sync-status').textContent = '読み込み中…';
  document.getElementById('sync-btn').disabled = true;
  document.getElementById('cards').innerHTML   = '<div class="loading">データを読み込んでいます…</div>';
  try {
    // トークンを毎回再取得（キャッシュされたトークンを避ける）
    const accounts = msalInstance.getAllAccounts();
    if (accounts.length > 0) {
      try {
        const freshToken = await msalInstance.acquireTokenSilent({
          scopes: ['Files.ReadWrite','Sites.ReadWrite.All'],
          account: accounts[0],
          forceRefresh: true
        });
        accessToken = freshToken.accessToken;
      } catch(e) { /* トークン更新失敗時は既存トークンを使用 */ }
    }
    // まずサイトIDを取得してからファイルにアクセス
    const siteRes = await fetch(
      `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteHost}:${CONFIG.sitePath}`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!siteRes.ok) throw new Error(`サイト取得失敗 HTTP ${siteRes.status}: ${await siteRes.text()}`);
    const siteData = await siteRes.json();
    const siteId = siteData.id;

    // ドライブIDを取得
    const driveRes = await fetch(
      `https://graph.microsoft.com/v1.0/sites/${siteId}/drive`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!driveRes.ok) throw new Error(`ドライブ取得失敗 HTTP ${driveRes.status}: ${await driveRes.text()}`);
    const driveData = await driveRes.json();
    const driveId = driveData.id;

    // デバッグ情報をコンソールに出力
    console.log('=== デバッグ情報 ===');
    console.log('サイトID:', siteId);
    console.log('ドライブID:', driveId);
    console.log('ドライブ名:', driveData.name);

    // ルートフォルダの中身を確認
    const rootRes = await fetch(
      `https://graph.microsoft.com/v1.0/drives/${driveId}/root/children`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    const rootData = await rootRes.json();
    console.log('ルートフォルダ一覧:', rootData.value?.map(i => i.name));

    const filePath = CONFIG.filePath.startsWith('/') ? CONFIG.filePath.slice(1) : CONFIG.filePath;
    const encodedPath = filePath.split('/').map(s => encodeURIComponent(s)).join('/');
    const fileUrl = `https://graph.microsoft.com/v1.0/drives/${driveId}/root:/${encodedPath}:/content`;
    console.log('アクセスURL:', fileUrl);

    const cacheBuster = Date.now() + '_' + Math.random().toString(36).slice(2);
    const res = await fetch(fileUrl + '?nocache=' + cacheBuster, {
      cache: 'no-store',
      headers: {
        Authorization: `Bearer ${accessToken}`,
        'Cache-Control': 'no-cache, no-store, must-revalidate',
        'Pragma': 'no-cache',
      }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const text = await res.text();
    let raw = [];
    try { raw = JSON.parse(text); } catch { raw = []; }
    if (!Array.isArray(raw)) raw = [raw];
    console.log('取得件数（展開前）:', raw.length);
    console.log('取得データ:', JSON.stringify(raw.map(d => ({Id: d.Id, 企業: d.企業, 契約開始日: d.契約開始日}))));
    state = expandRows(raw);
    console.log('展開後件数:', state.length);
    rebuildFilters();
    renderAll();
    const now = new Date().toLocaleTimeString('ja-JP');
    document.getElementById('sync-status').textContent = `最終更新：${now}　（${state.length}件）`;
  } catch(e) {
    showError('データの読み込みに失敗しました。<br>詳細: ' + e.message);
    document.getElementById('sync-status').textContent = '読み込み失敗';
    document.getElementById('cards').innerHTML = '<div class="empty">データの読み込みに失敗しました。更新ボタンを押してください。</div>';
  } finally {
    document.getElementById('sync-btn').disabled = false;
  }
}

async function saveData() {
  if (!accessToken) return;
  // スタッフ別展開行をIdごとに1件にまとめて重複を排除
  const seen = new Set();
  const payload = [];
  for (const d of state) {
    const key = String(d.Id) + '|' + String(d.企業);
    if (!seen.has(key)) {
      seen.add(key);
      payload.push({
        Id: d.Id, 支店: d.支店, 営業担当: d.営業担当,
        企業: d.企業, スタッフ: d.スタッフ, 契約種別: d.契約種別,
        人数: d.人数, 契約開始日: d.契約開始日, 期限: d.期限,
        派遣元責任者: d.派遣元責任者, 就労制限: d.就労制限,
        内容の変更: d.内容の変更, データシート格納: d.データシート格納,
        備考: d._formNote,  // Formsの備考は保持
        _status: d._status, _maker: d._maker,
        _corp_sender: d._corp_sender, _corp_date: d._corp_date,
        _staff_sender: d._staff_sender, _staff_date: d._staff_date,
      });
    }
  }
  const siteRes2 = await fetch(
    `https://graph.microsoft.com/v1.0/sites/${CONFIG.siteHost}:${CONFIG.sitePath}`,
    { headers: { Authorization: `Bearer ${accessToken}` } }
  );
  const siteData2 = await siteRes2.json();
  const siteId2 = siteData2.id;

  const driveRes2 = await fetch(
    `https://graph.microsoft.com/v1.0/sites/${siteId2}/drive`,
    { headers: { Authorization: `Bearer ${accessToken}` } }
  );
  const driveData2 = await driveRes2.json();
  const driveId2 = driveData2.id;

  const filePath2 = CONFIG.filePath.startsWith('/') ? CONFIG.filePath.slice(1) : CONFIG.filePath;
  const encodedPath2 = filePath2.split('/').map(s => encodeURIComponent(s)).join('/');
  // ファイルを一度削除してから新規作成（チェックアウト回避）
  const fileMetaUrl = `https://graph.microsoft.com/v1.0/drives/${driveId2}/root:/${encodedPath2}`;
  
  // 既存ファイルのeTagを取得
  const metaRes = await fetch(fileMetaUrl, {
    headers: { Authorization: `Bearer ${accessToken}` }
  });
  
  if (metaRes.ok) {
    const metaData = await metaRes.json();
    const fileId = metaData.id;
    
    // ファイルIDを使って直接上書き（チェックアウトを発生させない）
    const saveUrl2 = `https://graph.microsoft.com/v1.0/drives/${driveId2}/items/${fileId}/content`;
    const res2 = await fetch(saveUrl2, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${accessToken}`,
        'Content-Type': 'text/plain; charset=utf-8',
      },
      body: JSON.stringify(payload, null, 2)
    });
    if (!res2.ok) throw new Error(`HTTP ${res2.status}: ${await res2.text()}`);
  } else {
    // ファイルが存在しない場合は新規作成
    const saveUrl = `https://graph.microsoft.com/v1.0/drives/${driveId2}/root:/${encodedPath2}:/content`;
    const res = await fetch(saveUrl, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${accessToken}`,
        'Content-Type': 'text/plain; charset=utf-8',
      },
      body: JSON.stringify(payload, null, 2)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
  }
}

function parseDeadline(v) {
  if (!v || v === '') return null;
  const n = parseFloat(v);
  if (!isNaN(n) && n > 40000) {
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    d.setHours(0,0,0,0); return d;
  }
  const parts = v.replace(/[年月\/\-]/g,' ').split(/\s+/).filter(Boolean);
  if (parts.length >= 3) {
    const d = new Date(parseInt(parts[0]), parseInt(parts[1])-1, parseInt(parts[2]));
    d.setHours(0,0,0,0); return d;
  }
  return null;
}
function deadlineStatus(v) {
  // 更新契約書：契約開始日までの残り日数でアラート
  const d = parseDeadline(v); if (!d) return 'none';
  const diff = Math.ceil((d - today) / 86400000);
  if (diff < 0)  return 'urgent';   // 開始日超過
  if (diff <= 3) return 'urgent';   // 3日以内
  if (diff <= 7) return 'soon3';    // 7日以内
  if (diff <= 14) return 'soon7';   // 14日以内
  return 'normal';
}
function deadlineLabel(v, status) {
  // 更新契約書：契約開始日までの残り日数
  const d = parseDeadline(v); if (!d) return { cls: 'dl-none', text: '開始日未定', sub: null };
  const ds = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  if (status === '作成完了' || status === '依頼キャンセル') return { cls: 'dl-normal', text: ds, sub: null };
  const diff = Math.ceil((d - today) / 86400000);
  if (diff < 0)   return { cls: 'dl-urgent', text: ds, sub: `開始日${Math.abs(diff)}日超過` };
  if (diff === 0) return { cls: 'dl-urgent', text: ds, sub: '本日開始' };
  if (diff <= 3)  return { cls: 'dl-urgent', text: ds, sub: `開始まで${diff}日` };
  if (diff <= 7)  return { cls: 'dl-soon3',  text: ds, sub: `開始まで${diff}日` };
  if (diff <= 14) return { cls: 'dl-soon7',  text: ds, sub: `開始まで${diff}日` };
  return { cls: 'dl-normal', text: ds, sub: null };
}
function cardBorderClass(v, status) {
  if (status === '作成完了' || status === '依頼キャンセル') return '';
  const s = deadlineStatus(v);
  if (s === 'urgent') return 'deadline-urgent';  // 1日以内＋期限切れ
  if (s === 'soon3')  return 'deadline-soon3';   // 3日以内
  if (s === 'soon7')  return 'deadline-soon7';   // 7日以内
  return '';
}
function statusBadgeClass(s) {
  if (!s || s === '依頼受付')  return 'badge-pending';
  if (s === '作成完了')         return 'badge-done';
  if (s === '支店チェック待ち' || s === '支店対応依頼中') return 'badge-check';
  if (s === '依頼キャンセル')   return 'badge-cancel';
  return 'badge-pending';
}
function kindBadgeClass(k) { return k && k.includes('巻き直し') ? 'badge-replace' : 'badge-new'; }

function getFiltered() {
  const q          = document.getElementById('search').value.toLowerCase();
  const branch     = document.getElementById('filterBranch').value;
  const tanto      = document.getElementById('filterTanto').value;
  const kind       = document.getElementById('filterKind').value;
  const status     = document.getElementById('filterStatus').value;
  const dl         = document.getElementById('filterDeadline').value;
  const dateFrom = document.getElementById('filterDateFrom')?.value || '';
  const dateTo   = document.getElementById('filterDateTo')?.value || '';
  const sort       = document.getElementById('sortOrder')?.value || 'new';

  let filtered = state.filter(d => {
    if (q && !d.企業?.toLowerCase().includes(q) && !d._staffName.toLowerCase().includes(q)) return false;
    if (branch && d.支店      !== branch) return false;
    if (tanto  && d.営業担当  !== tanto)  return false;
    if (kind   && !d.契約種別?.includes(kind)) return false;
    if (status && d._status   !== status) return false;
    if (dl) {
      const s = deadlineStatus(d.契約開始日);
      if (dl === 'urgent' && s !== 'urgent')  return false;
      if (dl === 'soon3'  && s !== 'soon3')   return false;
      if (dl === 'soon7'  && s !== 'soon7')   return false;
    }
    // 期間指定フィルター
    // dateFrom指定あり：契約開始日がdateFrom以降
    if (dateFrom && d.契約開始日 && d.契約開始日 < dateFrom) return false;
    // dateTo指定あり：契約開始日がdateTo以前
    if (dateTo && d.契約開始日 && d.契約開始日 > dateTo) return false;
    // dateFromのみ：開始日以降の契約を全表示（契約開始日がない場合は除外しない）
    // dateToのみ：終了日以前の契約を全表示（契約開始日がない場合は除外しない）
    return true;
  });

  const STATUS_ORDER = ['依頼受付','支店チェック待ち','支店対応依頼中','作成完了','依頼キャンセル'];
  filtered.sort((a, b) => {
    switch (sort) {
      case 'new':
        return (parseFloat(b.Id) || 0) - (parseFloat(a.Id) || 0);
      case 'old':
        return (parseFloat(a.Id) || 0) - (parseFloat(b.Id) || 0);
      case 'deadline_asc': {
        // 作成完了・依頼キャンセルは末尾
        const aDone = (a._status === '作成完了' || a._status === '依頼キャンセル') ? 1 : 0;
        const bDone = (b._status === '作成完了' || b._status === '依頼キャンセル') ? 1 : 0;
        if (aDone !== bDone) return aDone - bDone;
        const da = parseDeadline(a.契約開始日), db = parseDeadline(b.契約開始日);
        if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
        return da - db;
      }
      case 'deadline_desc': {
        const aDone2 = (a._status === '作成完了' || a._status === '依頼キャンセル') ? 1 : 0;
        const bDone2 = (b._status === '作成完了' || b._status === '依頼キャンセル') ? 1 : 0;
        if (aDone2 !== bDone2) return aDone2 - bDone2;
        const da = parseDeadline(a.契約開始日), db = parseDeadline(b.契約開始日);
        if (!da && !db) return 0; if (!da) return 1; if (!db) return -1;
        return db - da;
      }
      case 'branch':
        return (a.企業||'').localeCompare(b.企業||'', 'ja');
      default:
        return 0;
    }
  });

  return filtered;
}

function renderMetrics(data) {
  const pending  = data.filter(d => d._status === '依頼受付').length;
  const done     = data.filter(d => d._status === '作成完了').length;
  const check    = data.filter(d => d._status === '支店対応依頼中').length;
  // 開始まで3日以内・超過（作成未完了のみ）
  const critical = data.filter(d => {
    const s = deadlineStatus(d.契約開始日);
    const notDone = d._status !== '作成完了' && d._status !== '依頼キャンセル';
    return notDone && s === 'urgent';
  }).length;
  // 開始まで7日以内（作成未完了のみ）
  const soon3 = data.filter(d => {
    const s = deadlineStatus(d.契約開始日);
    const notDone = d._status !== '作成完了' && d._status !== '依頼キャンセル';
    return notDone && s === 'soon3';
  }).length;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-label">依頼受付</div><div class="metric-val" style="color:#1E2761">${pending}</div></div>
    <div class="metric"><div class="metric-label">支店対応中</div><div class="metric-val" style="color:#7C3AED">${check}</div></div>
    <div class="metric"><div class="metric-label">開始まで7日以内</div><div class="metric-val" style="color:#EA580C">${soon3}</div></div>
    <div class="metric"><div class="metric-label">開始まで3日以内・超過</div><div class="metric-val" style="color:#DC2626">${critical}</div></div>`;
}

async function saveCard(uid) {
  if (!isEdit) return;
  const item = state.find(d => d._uid === uid); if (!item) return;
  item._status       = document.getElementById('status-'+uid).value;
  item._maker        = document.getElementById('maker-'+uid).value;
  item._note         = document.getElementById('note-'+uid).value;
  item._corp_sender  = document.getElementById('csender-'+uid).value;
  item._corp_date    = document.getElementById('cdate-'+uid).value;
  item._staff_sender = document.getElementById('ssender-'+uid).value;
  item._staff_date   = document.getElementById('sdate-'+uid).value;

  // ステータスバッジを更新
  const badge = document.getElementById('sbadge-'+uid);
  if (badge) { badge.className = 'badge '+statusBadgeClass(item._status); badge.textContent = item._status; }

  // カードの左ボーダー色を更新（作成完了はボーダーなし）
  const card = document.getElementById('card-'+uid);
  if (card) {
    card.classList.remove('deadline-urgent','deadline-soon3','deadline-soon7');
    if (item._status !== '作成完了' && item._status !== '依頼キャンセル') {
      const bc = cardBorderClass(item.契約開始日, item._status);
      if (bc) card.classList.add(bc);
    }
  }

  // 期限ラベルの色も更新（作成完了は通常色に）
  const dlEl = card?.querySelector('.dl-over, .dl-urgent, .dl-soon, .dl-normal, .dl-none');
  if (dlEl && (item._status === '作成完了' || item._status === '依頼キャンセル')) {
    const dl = deadlineLabel(item.契約開始日, item._status);
    dlEl.className = 'dl-normal';
  }

  try {
    await saveData();
    const msg = document.getElementById('saved-'+uid);
    if (msg) { msg.style.display = 'inline'; setTimeout(() => { msg.style.display = 'none'; }, 3000); }
  } catch(e) {
    showError('保存に失敗しました: ' + e.message);
  }

  // メトリクスのみ更新（カード全体の再描画はしない→複製防止）
  renderMetrics(getFiltered());
}

function renderAll() { const d = getFiltered(); renderMetrics(d); renderCards(d); }

['search','filterBranch','filterTanto','filterKind','filterStatus','filterDeadline','filterDateFrom','filterDateTo','sortOrder']
  .forEach(id => document.getElementById(id).addEventListener('change', renderAll));
document.getElementById('search').addEventListener('input', renderAll);
document.getElementById('filterDateFrom').addEventListener('input', renderAll);
document.getElementById('filterDateTo').addEventListener('input', renderAll);

// 5分ごとに自動更新
setInterval(() => { if (accessToken) loadData(); }, 5 * 60 * 1000);

// DOMContentLoaded後にMSAL初期化
document.addEventListener('DOMContentLoaded', async () => {
  // MSALスクリプトの読み込み完了を待つ
  let attempts = 0;
  while (typeof msal === 'undefined' && attempts < 50) {
    await new Promise(r => setTimeout(r, 100));
    attempts++;
  }
  if (typeof msal === 'undefined') {
    showError('認証ライブラリの読み込みに失敗しました。ページを再読み込みしてください。');
    return;
  }
  // ログインボタンを有効化
  const btn = document.getElementById('login-btn');
  btn.disabled = false;
  btn.style.opacity = '1';
  btn.style.cursor = 'pointer';
  btn.textContent = 'Microsoftでログイン';
  await initMsal();
});
</script>
</body>
