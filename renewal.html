<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>契約更新管理 SharePoint版</title></head><body><h1>契約更新管理 SharePoint版</h1><p>Graph APIでSharePointリストを読み込むテンプレート</p><script>
const SITE_ID="humans.sharepoint.com,3535fafa-8772-40f5-8890-91558781da79,21fee808-6035-4845-ac63-b62263228e0b";
const LIST_ID="7ef80114-c3a5-4800-9ce6-ff1d3336851c";
async function loadData(accessToken){
 const url=`https://graph.microsoft.com/v1.0/sites/${SITE_ID}/lists/${LIST_ID}/items?$expand=fields`;
 const res=await fetch(url,{headers:{Authorization:`Bearer ${accessToken}`}});
 const data=await res.json();
 return data.value.map(item=>({
  Id:item.id,
  支店:item.fields["_x652f__x5e97_"],
  営業担当:item.fields["_x55b6__x696d__x62c5__x5f53_"],
  企業:item.fields["_x4f01__x696d_"],
  スタッフ:item.fields["_x30b9__x30bf__x30c3__x30d5_"],
  人数:item.fields["_x4eba__x6570_"],
  契約種別:item.fields["_x5951__x7d04__x7a2e__x5225_"],
  契約開始日:item.fields["_x5951__x7d04__x958b__x59cb__x65"],
  契約終了日:item.fields["_x5951__x7d04__x7d42__x4e86__x65"],
  作成状況:item.fields["_x4f5c__x6210__x72b6__x6cc1_"],
  Forms備考:item.fields["Forms_x5099__x8003_"]
 }));
}
</script></body></html>
